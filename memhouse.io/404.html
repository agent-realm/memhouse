<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — memhouse</title>
<link rel="icon" type="image/svg+xml" href="/logo-2.svg">
<link rel="stylesheet" href="/style-3.css">
<script>
  try {
    var t = localStorage.getItem('memhouse-theme');
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
</script>
</head>
<body>
<section class="hero" style="min-height:70vh;display:flex;align-items:center">
  <div class="wrap" style="text-align:center">
    <img src="/logo-2.svg" alt="" width="56" height="56" style="border-radius:16px;margin-bottom:22px">
    <h1 class="hero-title" style="font-size:clamp(32px,6vw,56px)">Nothing in this room.</h1>
    <p class="hero-sub" style="margin:18px auto 30px">
      That page isn't in the house. The front door still works.
    </p>
    <a class="btn btn-primary" href="/">Back to memhouse.io</a>
  </div>
</section>
</body>
</html>
