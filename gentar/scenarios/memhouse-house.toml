# Subject: memhouse — a REAL house, end to end. The README's no-ClickHouse
# path: `memhouse deploy --local` stands up a loopback ClickHouse via the
# bench's own Docker daemon (benches are sbx sandboxes with nested Docker,
# spike-proven), then installs and wires the CLI. Verdicts are sql-count
# against the live house over HTTP — the gauntlet memory-house matrix's
# core assertion grammar, ported to the current (0.18.x, one-layout)
# data model: rooms exist, and attribution is enforced by the server,
# not claimed by the client.
#
# Heavy tier: pulls the ClickHouse image inside the sandbox. Nightly /
# dispatch, not gate.

[scenario]
name = "memhouse-house"
subject = "memhouse"
agent = "shell"
template = "gentar-bench-v1"
# The bench-free dry-run cannot stand up a house: it would need Docker on
# the host. Phase 1 reports this suite UNVERIFIED with this reason (gentar
# >= 0.9.3; an older engine ignores the key); the arena runs it.
bench_only = "deploys a ClickHouse house through the bench's own Docker (memhouse deploy --local)"

[budget]
tokens = 50000   # accounting headroom for the nightly cap; oracle is no-LLM

[oracle]
steps = [
  # README: Node >= 24 (node:sqlite; `memhouse install` refuses older).
  # The bench template has node 22, so meet the requirement the way a user
  # would: the official latest v24 build, checked against nodejs.org's
  # SHA256 list, into /usr/local (ahead of /usr/bin on PATH).
  '''set -e; cd /tmp
case $(uname -m) in x86_64) A=x64;; aarch64|arm64) A=arm64;; *) echo "no node build for $(uname -m)"; exit 1;; esac
B=https://nodejs.org/dist/latest-v24.x; S=$(curl -fsSL "$B/SHASUMS256.txt")
F=$(printf '%s\n' "$S" | awk -v f="linux-$A.tar.gz" '$2 ~ (f "$") {print $2}')
curl -fsSLO "$B/$F"
printf '%s\n' "$S" | grep " $F\$" | sha256sum -c -
sudo tar -xzf "$F" -C /usr/local --strip-components=1 --no-same-owner
node --version''',
  # The documented `npm install -g memhouse`, from the tree under test:
  # pack it as a publish would (prepack builds the UI; the package.json
  # "files" allowlist decides what ships), then install that tarball.
  # `npm install -g <folder>` only links the folder and skips its
  # dependencies (npm 11), so @clickhouse/client was missing.
  # A fresh directory per run, and a failed pack or install fails the step
  # (a `| tail` hid one: the step passed and memhouse was missing).
  '''D=$(mktemp -d) && cd "$D"
npm pack "$WORKSPACE_DIR" > pack.log 2>&1 || { tail -30 pack.log; exit 1; }
npm install -g "$D"/memhouse-*.tgz > install.log 2>&1 || { tail -30 install.log; exit 1; }
tail -3 install.log''',
  # Documented no-ClickHouse path: loopback house + install + wiring.
  # Ownership first: deploy uses fixed names (memhouse-clickhouse, memhouse-data),
  # and the teardown below removes whatever carries them. So prove neither exists
  # under any engine that is installed, refuse if one does or an engine cannot
  # answer, and only then leave the marker that says this suite owns the house.
  # The marker is written before deploy, so a deploy that dies half-way is still
  # cleaned up; after deploy it records which engine holds the house.
  '''M="$HOME/.memhouse-house-suite-owns"; rm -f "$M"
for e in docker podman; do
  command -v "$e" >/dev/null 2>&1 || continue
  n=$("$e" ps -a --format '{{.Names}}') && v=$("$e" volume ls -q) || { echo "$e does not answer; cannot prove no house exists here"; exit 1; }
  if printf '%s\n' "$n" | grep -qx memhouse-clickhouse || printf '%s\n' "$v" | grep -qx memhouse-data; then
    echo "a memhouse house already exists under $e; refusing to deploy over it or tear it down"; exit 1
  fi
done
: > "$M"
L=$(mktemp); memhouse deploy --local > "$L" 2>&1 || { tail -30 "$L"; exit 1; }; tail -15 "$L"
for e in docker podman; do
  command -v "$e" >/dev/null 2>&1 || continue
  "$e" ps -a --format '{{.Names}}' 2>/dev/null | grep -qx memhouse-clickhouse && { echo "$e" > "$M"; break; }
done''',
  'memhouse status 2>&1 | tail -10',
]

[[verify.commands]]
# ~/.memhouse/env exists and sources cleanly (its shell form IS the
# interface — skills and docs `. ~/.memhouse/env`).
command = 'test -f "$HOME/.memhouse/env" && set -a && . "$HOME/.memhouse/env" && set +a && test -n "$MEMHOUSE_URL" && test -n "$MEMHOUSE_DB" && echo env-wired'
contains = "env-wired"

[[verify.commands]]
# sql-count, live house: the member's three rooms exist in the house
# database, named for the member (<member>_sessions, …; memhouse's
# physicalRoom(), one layout since df18d5a). Until 2026-10-03 this asked
# for bare names and went stale unnoticed while gentar's nightly skipped it.
command = '''set -a; . "$HOME/.memhouse/env"; set +a
Q="SELECT count() FROM system.tables WHERE database='$MEMHOUSE_DB' AND name IN ('${MEMHOUSE_USER}_sessions','${MEMHOUSE_USER}_messages','${MEMHOUSE_USER}_tool_calls')"
curl -s "$MEMHOUSE_URL/?default_format=TSV" -u "$MEMHOUSE_USER:$MEMHOUSE_PASSWORD" --data-binary "$Q"'''
contains = "3"

[[verify.commands]]
# sql-count: attribution is server-side in every room — user_id is a
# MATERIALIZED column, so no client can claim to be someone else.
command = '''set -a; . "$HOME/.memhouse/env"; set +a
Q="SELECT count() FROM system.columns WHERE database='$MEMHOUSE_DB' AND name='user_id' AND default_kind='MATERIALIZED' AND default_expression='currentUser()'"
curl -s "$MEMHOUSE_URL/?default_format=TSV" -u "$MEMHOUSE_USER:$MEMHOUSE_PASSWORD" --data-binary "$Q"'''
contains = "3"

[[verify.commands]]
# sql-count: the house answers as the OS user (whatever the bench runs
# as — `agent` today) — the stamp fires for real.
command = '''U=$(id -un); set -a; . "$HOME/.memhouse/env"; set +a
Q="SELECT currentUser()"
R=$(curl -s "$MEMHOUSE_URL/?default_format=TSV" -u "$MEMHOUSE_USER:$MEMHOUSE_PASSWORD" --data-binary "$Q")
test "$R" = "$U" && echo "stamp-live user=$R"'''
contains = "stamp-live"

[[verify.commands]]
command = 'memhouse stats 2>&1 | tail -5'

[[verify.commands]]
# README: `memhouse deploy --down` removes the local house, container and
# volume. Also this suite's teardown, so it stays LAST (every check above sees
# the live house): a dry-run on a Docker host (gentar < 0.9.3, or
# GENTAR_DRYRUN_BENCH_ONLY=run) must not leave a house running there.
# Gated on the ownership marker the deploy step writes: without it this suite
# did not create the house, and anything named memhouse-* belongs to someone
# else. The --down exit status counts, and the engine that holds the house
# (recorded at deploy; both when unknown) must answer: a check that cannot ask
# never reports the house gone.
command = '''M="$HOME/.memhouse-house-suite-owns"
test -f "$M" || { echo "this suite did not create a house here; leaving any house alone"; exit 1; }
memhouse stop >/dev/null 2>&1
out=$(memhouse deploy --down --yes 2>&1); rc=$?; printf '%s\n' "$out" | tail -2
test "$rc" = 0 || { echo "deploy --down failed (exit $rc)"; exit 1; }
E=$(cat "$M"); left=0; asked=0
for e in ${E:-docker podman}; do
  command -v "$e" >/dev/null 2>&1 || continue
  n=$("$e" ps -a --format '{{.Names}}') && v=$("$e" volume ls -q) || { echo "$e does not answer; cannot confirm the house is gone"; exit 1; }
  asked=1
  printf '%s\n' "$n" | grep -qx memhouse-clickhouse && left=1
  printf '%s\n' "$v" | grep -qx memhouse-data && left=1
done
test "$asked" = 1 || { echo "no container engine answered to confirm with"; exit 1; }
test "$left" = 0 || { echo "the container or the volume is still there"; exit 1; }
rm -f "$M"; echo house-removed'''
contains = "house-removed"
