# Subject: memhouse — the memory plane (17-editor ingest into a
# ClickHouse you own). Oracle = the README's documented install path
# (`npm install -g memhouse`) run against the MOUNTED CHECKOUT, so the
# tree under test is what ships, not the registry copy. Assertions
# prove the README's core claims from the shipped artifacts: the three
# rooms, and attribution stamped server-side (user_id MATERIALIZED
# currentUser() — "every row says who wrote it, in a way no client can
# fake").

[scenario]
name = "memhouse-install"
subject = "memhouse"
agent = "shell"
template = "gentar-bench-v1"   # node + npm present

[oracle]
steps = [
  # Documented one-liner, pointed at the mounted tree. npm packs via the
  # package.json "files" allowlist, so workspace clutter never ships.
  'npm install -g "$WORKSPACE_DIR" 2>&1 | tail -3',
  'command -v memhouse && memhouse --version',
]

[[verify.commands]]
# Version floats from the subject's package.json — never hardcoded.
command = 'V=$(node -p "require(\"$WORKSPACE_DIR/package.json\").version"); memhouse --version | grep -F "$V" && echo version-floats'
contains = "version-floats"

[[verify.commands]]
# README claim: a house is three rooms (sessions, messages, tool_calls).
command = 'test "$(memhouse install --print-sql | grep -c "CREATE TABLE IF NOT EXISTS")" = 3 && echo three-rooms'
contains = "three-rooms"

[[verify.commands]]
# README claim: user_id is stamped by the server, in every room.
command = 'test "$(memhouse install --print-sql | grep -c "user_id String MATERIALIZED currentUser()")" = 3 && echo server-stamped'
contains = "server-stamped"

[[verify.commands]]
# The house DDL is qualified and runnable anywhere (no USE) — README
# promises "runs anywhere".
command = 'memhouse install --print-sql | grep -q "^USE " && echo has-use || echo no-use'
contains = "no-use"

[[verify.commands]]
command = 'memhouse --help >/dev/null && echo help-ok'
contains = "help-ok"
